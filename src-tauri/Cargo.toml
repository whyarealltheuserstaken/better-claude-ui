[package]
name = "better-claude-ui"
version = "0.1.0"
description = "Lightweight desktop UI for Claude Code"
authors = ["BetterClaudeUI contributors"]
edition = "2024"
default-run = "better-claude-ui"
autobins = false

[features]
# Builds the `fake-claude` test double and enables integration tests that need it.
test-support = []

[[bin]]
name = "better-claude-ui"
path = "src/main.rs"

[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
required-features = ["test-support"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "better_claude_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
tauri-plugin-updater = "2.14.1"
url = "2.5.9"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
