name: Release

# Runs when a version tag like v0.1.0 is pushed. Builds installers for Windows, macOS
# (universal: Intel + Apple Silicon) and Linux, and attaches them to a DRAFT GitHub release
# so a human can review the artifacts before publishing. Builds are unsigned (see docs).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BetterClaudeUI ${{ github.ref_name }}"
          releaseBody: "Unofficial community build. Not affiliated with Anthropic. Requires the Claude Code CLI (the app's setup wizard can install it). Windows and macOS builds are unsigned, so your OS may warn on first launch; see docs/RELEASING.md."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
